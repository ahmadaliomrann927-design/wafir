<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>وفّر</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--text:#f2f4f8;--mut:#8b93a3;--acc:#f5c542;--acc2:#3ddc97}
*{box-sizing:border-box;margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 6px}
header h1{font-size:22px;color:var(--acc)}
#today{color:var(--mut);font-size:13px}
main{padding:10px 16px}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#2a2410,#1a1d24);border:1px solid #3a3215}
.label{color:var(--mut);font-size:13px;margin-bottom:6px}
.big{font-size:44px;font-weight:700;color:var(--acc)}
.mid{font-size:26px;font-weight:700;color:var(--acc2)}
small{font-size:13px;color:var(--mut);font-weight:400}
.sub{color:var(--mut);font-size:12px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0}
h2{font-size:17px;margin-bottom:12px}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:12px}
input{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #2c313c;background:#0f1115;color:var(--text);font-size:16px}
#save{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#111;font-size:16px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#14171d;border-top:1px solid #232834;padding:8px 0 12px}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:20px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:11px}
nav button.on{color:var(--acc)}
</style>
</head>
<body>
<header><h1>⚡ وفّر</h1><span id="today"></span></header>

<main>
  <section id="home" class="tab active">
    <div class="card hero">
      <div class="label">التوليد المتوقع اليوم</div>
      <div class="big"><span id="gen">0</span> <small>كيلوواط ساعة</small></div>
      <div class="sub">بناءً على قدرة الألواح وساعات الشمس</div>
    </div>
    <div class="grid">
      <div class="card"><div class="label">سعة البطارية</div><div class="mid"><span id="bat">0</span> <small>kWh</small></div></div>
      <div class="card"><div class="label">مدة التشغيل (حمل 500 واط)</div><div class="mid"><span id="hours">0</span> <small>ساعة</small></div></div>
      <div class="card"><div class="label">قدرة الإنفرتر</div><div class="mid"><span id="inv">0</span> <small>واط</small></div></div>
      <div class="card"><div class="label">قدرة الألواح</div><div class="mid"><span id="pv">0</span> <small>واط</small></div></div>
    </div>
  </section>

  <section id="readings" class="tab"><div class="card">📅 قراءات العداد: الخطوة 2</div></section>
  <section id="devices" class="tab"><div class="card">🔌 حاسبة الأجهزة: الخطوة 3</div></section>

  <section id="settings" class="tab">
    <div class="card">
      <h2>النظام الشمسي</h2>
      <label>عدد الألواح <input id="s_panels" type="number" min="0"></label>
      <label>استطاعة اللوح (واط) <input id="s_panelW" type="number" min="0"></label>
      <label>سعة البطارية (kWh) <input id="s_bat" type="number" step="0.1" min="0"></label>
      <label>قدرة الإنفرتر (واط) <input id="s_inv" type="number" min="0"></label>
      <label>ساعات الشمس الفعالة يومياً <input id="s_sun" type="number" step="0.1" min="0"></label>
      <button id="save">حفظ</button>
    </div>
  </section>
</main>

<nav>
  <button data-tab="home" class="on">🏠<span>الرئيسية</span></button>
  <button data-tab="readings">📅<span>القراءات</span></button>
  <button data-tab="devices">🔌<span>الأجهزة</span></button>
  <button data-tab="settings">⚙️<span>الإعدادات</span></button>
</nav>

<script>
const DEFAULTS = { panels: 4, panelW: 550, bat: 5, inv: 3500, sun: 4 };
const KEY = "wafir_settings";

function load() {
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; }
  catch { return { ...DEFAULTS }; }
}
function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} }

function render() {
  const s = load();
  const pv = s.panels * s.panelW;
  const gen = (pv * s.sun * 0.8) / 1000; // كفاءة 80%
  const usable = s.bat * 0.8; // عمق تفريغ 80%
  const hours = usable * 1000 / 500;
  const f = (n, d = 1) => (+n).toFixed(d);
  document.getElementById("gen").textContent = f(gen);
  document.getElementById("bat").textContent = f(s.bat);
  document.getElementById("hours").textContent = f(hours);
  document.getElementById("inv").textContent = s.inv;
  document.getElementById("pv").textContent = pv;
  document.getElementById("s_panels").value = s.panels;
  document.getElementById("s_panelW").value = s.panelW;
  document.getElementById("s_bat").value = s.bat;
  document.getElementById("s_inv").value = s.inv;
  document.getElementById("s_sun").value = s.sun;
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
  document.getElementById(b.dataset.tab).classList.add("active");
  b.classList.add("on");
});

document.getElementById("save").onclick = () => {
  const v = id => parseFloat(document.getElementById(id).value) || 0;
  save({ panels: v("s_panels"), panelW: v("s_panelW"), bat: v("s_bat"), inv: v("s_inv"), sun: v("s_sun") });
  render();
  document.querySelector('nav [data-tab="home"]').click();
};

document.getElementById("today").textContent = new Date().toLocaleDateString("ar-SY", { weekday: "long", day: "numeric", month: "long" });
render();
</script>
</body>
</html>
